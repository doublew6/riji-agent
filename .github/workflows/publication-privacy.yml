name: publication privacy

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  public-text:
    runs-on: ubuntu-latest
    steps:
      # Event text is untrusted data. Never check out or execute a PR head here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check issue, PR, and comment text
        run: python scripts/privacy_scan.py --event-file "$GITHUB_EVENT_PATH"
