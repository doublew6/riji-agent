name: iOS interaction diagnostics (not acceptance)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  ui-smoke:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 4]
    env:
      IOS_SMOKE_SHARD: ${{ matrix.shard }}/4
      TEST_RUNNER_RIJI_TEST_MENU_TRACE: '1'
      TEST_RUNNER_RIJI_TEST_EXPORT_TRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose complete Native and original UI shard (not acceptance)
        timeout-minutes: 55
        run: python3 scripts/test_ios.py --suite ui-smoke --smoke-shard "$IOS_SMOKE_SHARD"
      - name: Retain logs, inventories and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-ui-smoke-${{ matrix.shard }}
          path: output/ios-tests/
          if-no-files-found: error
          retention-days: 14
